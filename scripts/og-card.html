<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Cairo';
        src: url('../public/fonts/cairo-arabic.woff2') format('woff2');
        font-weight: 400 800;
        unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF,
          U+FE70-FEFF, U+200C-200E;
      }
      @font-face {
        font-family: 'Cairo';
        src: url('../public/fonts/cairo-latin.woff2') format('woff2');
        font-weight: 400 800;
        unicode-range: U+0000-00FF, U+2000-206F;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: Cairo, sans-serif;
        color: #0d1b2e;
        background: #f4f8fd;
        /* The same 28px engineering grid the hero carries. */
        background-image:
          linear-gradient(rgba(59, 130, 196, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(59, 130, 196, 0.05) 1px, transparent 1px);
        background-size: 28px 28px;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        gap: 48px;
        padding: 0 64px;
        overflow: hidden;
      }
      .glow {
        position: absolute;
        inset-block-start: -180px;
        inset-inline-end: -120px;
        width: 640px;
        height: 640px;
        border-radius: 999px;
        background: radial-gradient(
          circle at center,
          #dcebf9 0%,
          rgba(244, 248, 253, 0) 70%
        );
      }
      .copy {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand img {
        width: 62px;
        height: 62px;
      }
      .brand span {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 3px;
        color: #3b82c4;
      }
      h1 {
        font-size: 68px;
        font-weight: 800;
        line-height: 1.18;
        letter-spacing: -0.5px;
      }
      h1 mark {
        background: linear-gradient(180deg, transparent 60%, #d6e9f9 60%);
        color: #1f5ea3;
      }
      p {
        font-size: 27px;
        line-height: 1.6;
        color: #4a6480;
        max-width: 24ch;
      }
      .chips {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .chip {
        border-radius: 999px;
        padding: 12px 22px;
        font-size: 20px;
        font-weight: 700;
        border: 2px solid #d3e5f6;
        background: #fff;
        color: #1f5ea3;
      }
      .chip.solid {
        background: #3b82c4;
        border-color: #3b82c4;
        color: #fff;
      }
      .chip.soon {
        background: #fef3e2;
        border-color: #f0d8ae;
        color: #8a5410;
      }
      .phone {
        position: relative;
        flex: none;
        width: 258px;
        padding: 10px;
        border-radius: 44px;
        background: linear-gradient(160deg, #16324f, #0d1b2e);
        box-shadow: 0 40px 70px -34px rgba(13, 27, 46, 0.6);
        transform: rotate(-3deg);
      }
      .phone > div {
        border-radius: 34px;
        overflow: hidden;
        background: #0d1b2e;
        aspect-ratio: 640 / 1386;
      }
      .phone img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
        display: block;
      }
      .bar {
        position: absolute;
        inset-inline: 0;
        bottom: 0;
        height: 9px;
        background: linear-gradient(90deg, #3b82c4, #1f5ea3);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow"></div>
      <div class="copy">
        <div class="brand">
          <img src="../public/logo-blue.png" alt="" />
          <span>VROM</span>
        </div>
        <h1>القطعة تيجيلك<br /><mark>لحد باب بيتك</mark></h1>
        <p>
          من تاجرك اللي بتشتري منه — من غير مشوار. أو مش لاقيها عنده؟ العروض
          تيجيلك وإنت تختار.
        </p>
        <div class="chips">
          <span class="chip solid">لحد باب البيت</span>
          <span class="chip">الدفع عند الاستلام</span>
          <span class="chip">لكل محافظات مصر</span>
          <span class="chip soon">قريبًا على المتاجر</span>
        </div>
      </div>
      <div class="phone">
        <div><img src="../public/screens/home.png" alt="" /></div>
      </div>
      <div class="bar"></div>
    </div>
  </body>
</html>
